name: Telegram Publisher

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "Testing Telegram connection..."

          RESPONSE=$(curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=@AIFactoryA" \
            --data-urlencode "text=🤖 Тест AI Content Factory

GitHub Actions успешно подключился к Telegram.")

          echo "Telegram response:"
          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "SUCCESS: Telegram message sent."
          else
            echo "ERROR: Telegram rejected the request."
            exit 1
          fi
