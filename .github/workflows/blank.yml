name: AI Content Factory

on:
  workflow_dispatch:

  schedule:
    - cron: "17 7 * * *"
    - cron: "17 11 * * *"
    - cron: "17 15 * * *"
    - cron: "17 19 * * *"

permissions:
  contents: write

concurrency:
  group: ai-content-factory-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin fonts-dejavu-core

      - name: Generate and publish post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@AIFactoryA"
        run: |

          python3 <<'PY'
