                  stroke="url(#circle)"
                  stroke-width="2"
                  opacity="0.25"/>

          <circle cx="1110" cy="120" r="145"
                  fill="none"
                  stroke="#ffffff"
                  stroke-width="1"
                  opacity="0.15"/>

          <circle cx="1090" cy="580" r="280"
                  fill="#ffffff"
                  opacity="0.025"/>

          <rect x="90" y="80" width="330" height="54"
                rx="27"
                fill="#ffffff"
                opacity="0.10"/>

          <text x="120" y="116"
                font-family="DejaVu Sans"
                font-size="25"
                font-weight="bold"
                fill="#67e8f9">
                {html.escape(category)}
          </text>

          <text x="90" y="215"
                font-family="DejaVu Sans"
                font-size="48"
                font-weight="bold"
                fill="white">
                {title_spans}
          </text>

          <line x1="90" y1="520" x2="1190" y2="520"
                stroke="#ffffff"
                opacity="0.15"/>

          <text x="90" y="580"
                font-family="DejaVu Sans"
                font-size="25"
                fill="#cbd5e1">
                AI CONTENT FACTORY
          </text>

          <text x="90" y="625"
                font-family="DejaVu Sans"
                font-size="22"
                fill="#94a3b8">
                Практические идеи • ИИ • бизнес • технологии
          </text>

          <text x="1120" y="625"
                font-family="DejaVu Sans"
                font-size="28"
                font-weight="bold"
                text-anchor="middle"
                fill="#67e8f9">
                #{post_number}
          </text>

          </svg>
          """

          Path("post.svg").write_text(svg, encoding="utf-8")

          # ============================================================
          # SVG -> PNG
          # ============================================================

          subprocess.run(
              ["convert", "-background", "none", "post.svg", "post.png"],
              check=True
          )

          # ============================================================
          # ОТПРАВКА КАРТИНКИ В TELEGRAM
          # ============================================================

          caption = (
              f"🚀 {topic}\n\n"
              f"#{category.replace(' ', '_').replace('И', 'I')}"
          )

          telegram_url = (
              f"https://api.telegram.org/bot{TOKEN}/sendPhoto"
          )

          result = subprocess.run(
              [
                  "curl",
                  "-sS",
                  "-X", "POST",
                  telegram_url,
                  "-F", f"chat_id={CHANNEL}",
                  "-F", f"caption={caption}",
                  "-F", "photo=@post.png"
              ],
              capture_output=True,
              text=True
          )

          print(result.stdout)

          if result.returncode != 0:
              print(result.stderr)
              raise SystemExit("Ошибка отправки изображения")

          try:
              response = json.loads(result.stdout)
              if not response.get("ok"):
                  raise SystemExit(
                      "Telegram API error: " +
                      str(response)
                  )
          except json.JSONDecodeError:
              raise SystemExit("Некорректный ответ Telegram")

          # ============================================================
          # ОТПРАВКА ПОЛНОГО ТЕКСТА
          # ============================================================

          telegram_message_url = (
              f"https://api.telegram.org/bot{TOKEN}/sendMessage"
          )

          result2 = subprocess.run(
              [
                  "curl",
                  "-sS",
                  "-X", "POST",
                  telegram_message_url,
                  "-F", f"chat_id={CHANNEL}",
                  "-F", f"text={post}"
              ],
              capture_output=True,
              text=True
          )

          print(result2.stdout)

          if result2.returncode != 0:
              print(result2.stderr)
              raise SystemExit("Ошибка отправки текста")

          try:
              response2 = json.loads(result2.stdout)
              if not response2.get("ok"):
                  raise SystemExit(
                      "Telegram API error: " +
                      str(response2)
                  )
          except json.JSONDecodeError:
              raise SystemExit("Некорректный ответ Telegram")

          # ============================================================
          # СОХРАНЯЕМ ТЕМУ В ИСТОРИЮ
          # ============================================================

          history.append(topic)

          HISTORY_FILE.write_text(
              json.dumps(history, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("")
          print("======================================")
          print("ПУБЛИКАЦИЯ УСПЕШНА")
          print("======================================")
          print("Номер:", post_number)
          print("Категория:", category)
          print("Тема:", topic)
          print("Использовано тем:", len(history))
          print("Осталось:", len(topics) - len(history))
          print("======================================")

          PY

      - name: Save publication history
        run: |
          git config user.name "AI Content Factory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/published_topics.json

          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -m "Update published topics history"
            git push
          fi
