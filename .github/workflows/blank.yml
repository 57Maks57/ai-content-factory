          categories = [
              "ИИ И АВТОМАТИЗАЦИЯ",
              "БИЗНЕС",
              "ДЕНЬГИ",
              "ПРОДУКТИВНОСТЬ",
              "КАРЬЕРА",
              "МАРКЕТИНГ",
              "TELEGRAM",
              "ТЕХНОЛОГИИ",
              "САМОРАЗВИТИЕ",
              "ПРАКТИКА"
          ]

          # ============================================================
          # ИСТОРИЯ
          # ============================================================

          if HISTORY_FILE.exists():
              try:
                  history = json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
              except Exception:
                  history = []
          else:
              history = []

          available = [
              i for i, topic in enumerate(topics)
              if topic not in history
          ]

          # Если все 100 тем закончились — начинаем новый цикл
          if not available:
              print("Все темы опубликованы. Начинаем новый цикл.")
              history = []
              available = list(range(len(topics)))

          topic_index = random.choice(available)
          topic = topics[topic_index]
          category = categories[topic_index // 10]

          # ============================================================
          # НОМЕР ПУБЛИКАЦИИ
          # ============================================================

          post_number = len(history) + 1

          # ============================================================
          # ТЕКСТ
          # ============================================================

          intros = [
              "Сегодня разберём практический инструмент, который можно применить уже сегодня.",
              "Если хочется экономить время и получать больше результата, начните с этого.",
              "Разберём простой подход, который можно внедрить без сложных систем.",
              "Одна из самых полезных привычек — постоянно искать способы делать рутину быстрее.",
              "Ниже — несколько практических идей, которые можно использовать в работе и бизнесе."
          ]

          conclusions = [
              "Главное — не пытаться внедрить всё сразу. Выберите один пункт и протестируйте его сегодня.",
              "Начните с самого простого шага. Через неделю уже будет понятно, что действительно работает.",
              "Системный небольшой прогресс обычно даёт больший результат, чем редкие большие рывки.",
              "Сохраните пост и попробуйте внедрить хотя бы один совет сегодня.",
              "Лучший способ проверить идею — применить её на практике."
          ]

          tips_by_category = {
              "ИИ И АВТОМАТИЗАЦИЯ": [
                  "Определите повторяющуюся задачу.",
                  "Опишите процесс по шагам.",
                  "Уберите ручные действия, которые можно автоматизировать.",
                  "Проверяйте результат перед использованием."
              ],

              "БИЗНЕС": [
                  "Начинайте с конкретной проблемы клиента.",
                  "Проверьте спрос до больших расходов.",
                  "Сделайте простое первое предложение.",
                  "Получите обратную связь от первых клиентов."
              ],

              "ДЕНЬГИ": [
                  "Зафиксируйте текущие расходы.",
                  "Разделите обязательные и необязательные траты.",
                  "Определите финансовую цель.",
                  "Регулярно анализируйте результат."
              ],

              "ПРОДУКТИВНОСТЬ": [
                  "Определите 1–3 главные задачи дня.",
                  "Уберите уведомления во время работы.",
                  "Группируйте похожие задачи.",
                  "Оставляйте резерв времени на непредвиденные дела."
              ],

              "КАРЬЕРА": [
                  "Определите навыки, которые нужны рынку.",
                  "Создайте измеримые результаты своей работы.",
                  "Обновите резюме и портфолио.",
                  "Регулярно изучайте новые инструменты."
              ],

              "МАРКЕТИНГ": [
                  "Говорите о конкретной проблеме клиента.",
                  "Показывайте результат, а не только характеристики.",
                  "Используйте реальные примеры.",
                  "Тестируйте разные форматы подачи."
              ],

              "TELEGRAM": [
                  "Определите конкретную тему канала.",
                  "Публикуйте регулярно.",
                  "Создавайте полезный контент.",
                  "Анализируйте реакцию аудитории."
              ],

              "ТЕХНОЛОГИИ": [
                  "Выберите одну задачу для автоматизации.",
                  "Не используйте инструмент только ради инструмента.",
                  "Проверяйте безопасность данных.",
                  "Документируйте рабочий процесс."
              ],

              "САМОРАЗВИТИЕ": [
                  "Выберите один навык.",
                  "Занимайтесь регулярно небольшими блоками.",
                  "Практикуйтесь на реальных задачах.",
                  "Фиксируйте прогресс."
              ],

              "ПРАКТИКА": [
                  "Выберите один способ из списка.",
                  "Поставьте конкретную задачу.",
                  "Сделайте первый шаг сегодня.",
                  "Оцените результат через несколько дней."
              ]
          }

          tips = tips_by_category[category]

          intro = random.choice(intros)
          conclusion = random.choice(conclusions)

          post = f"""🚀 {topic}

{intro}

Что можно сделать:

1️⃣ {tips[0]}

2️⃣ {tips[1]}

3️⃣ {tips[2]}

4️⃣ {tips[3]}

💡 Практический подход:
не пытайтесь изменить всё сразу. Выберите один пункт и внедрите его в ближайшие 24 часа.

{conclusion}

📌 Подписывайтесь на канал — здесь каждый день новые практические идеи по ИИ, бизнесу, технологиям и заработку.

#ИИ #бизнес #автоматизация #продуктивность #Telegram
"""

          # ============================================================
          # СОЗДАНИЕ SVG-КАРТИНКИ
          # ============================================================

          def wrap_text(text, width):
              words = text.split()
              lines = []
              current = ""

              for word in words:
                  test = (current + " " + word).strip()

                  if len(test) <= width:
                      current = test
                  else:
                      if current:
                          lines.append(current)
                      current = word

              if current:
                  lines.append(current)

              return lines

          title_lines = wrap_text(topic, 32)

          title_spans = ""

          for n, line in enumerate(title_lines[:4]):
              dy = 0 if n == 0 else 65
              title_spans += (
                  f'<tspan x="90" dy="{dy}">'
                  f'{html.escape(line)}'
                  f'</tspan>'
              )

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg"
          width="1280" height="720" viewBox="0 0 1280 720">

          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#07111f"/>
              <stop offset="55%" stop-color="#12345b"/>
              <stop offset="100%" stop-color="#0d7490"/>
            </linearGradient>

            <linearGradient id="circle" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#22d3ee"/>
            </linearGradient>
          </defs>

          <rect width="1280" height="720" fill="url(#bg)"/>

          <circle cx="1110" cy="120" r="210"
