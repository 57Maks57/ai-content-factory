name: AI Content Factory

on:
  workflow_dispatch:

  schedule:
    - cron: "17 7 * * *"
    - cron: "17 11 * * *"
    - cron: "17 15 * * *"
    - cron: "17 19 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and publish post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |

          python3 <<'PY'

          import os
          import json
          import urllib.request
          import random
          from pathlib import Path
          from datetime import datetime, timezone

          # ==========================================================
          # 100 ТЕМ
          # ==========================================================

          topics = [

          # 1-10 — ИИ ДЛЯ РАБОТЫ

          "Как использовать ИИ для планирования рабочего дня",
          "Как ИИ помогает писать деловые письма",
          "Как использовать ИИ для подготовки презентации",
          "Как ИИ помогает разбирать большие документы",
          "Как использовать ИИ для протоколов встреч",
          "Как ИИ помогает составлять инструкции",
          "Как использовать ИИ для поиска ошибок в тексте",
          "Как ИИ помогает готовить коммерческое предложение",
          "Как использовать ИИ для подготовки отчётов",
          "Как ИИ помогает структурировать рабочие задачи",

          # 11-20 — БИЗНЕС

          "10 задач малого бизнеса, которые можно автоматизировать",
          "Как ИИ помогает интернет-магазину",
          "Как использовать ИИ для анализа конкурентов",
          "Как ИИ помогает находить новые идеи для бизнеса",
          "Как использовать ИИ для описания товаров",
          "Как ИИ помогает отвечать клиентам",
          "Как автоматизировать обработку заявок",
          "Как использовать ИИ для подготовки рекламных идей",
          "Как ИИ помогает анализировать отзывы клиентов",
          "Как создать AI-ассистента для малого бизнеса",

          # 21-30 — ЗАРАБОТОК

          "Как использовать ИИ для поиска идей дополнительного заработка",
          "5 услуг с ИИ, которые можно предлагать клиентам",
          "Как создавать контент с помощью ИИ",
          "Как ИИ помогает фрилансеру экономить время",
          "Как использовать ИИ для создания коммерческих текстов",
          "Как ИИ помогает искать клиентов",
          "Как автоматизировать рутинную работу фрилансера",
          "Как использовать ИИ для создания цифрового продукта",
          "Как ИИ помогает начинающему предпринимателю",
          "5 способов превратить навык работы с ИИ в услугу",

          # 31-40 — ПРОМПТЫ

          "Как правильно писать запросы для ИИ",
          "5 ошибок при составлении промптов",
          "Как заставить ИИ отвечать структурированно",
          "Как попросить ИИ критиковать собственный ответ",
          "Как использовать роль эксперта в промпте",
          "Как задавать ИИ ограничения",
          "Как давать ИИ контекст задачи",
          "Как улучшить плохой ответ ИИ",
          "Как создавать многошаговые запросы",
          "Универсальная формула хорошего промпта",

          # 41-50 — АВТОМАТИЗАЦИЯ

          "Что такое AI-автоматизация простыми словами",
          "Как связать Telegram и ИИ",
          "Как автоматизировать публикацию контента",
          "Как автоматизировать ежедневный отчёт",
          "Как автоматизировать обработку сообщений",
          "Как автоматизировать сбор информации",
          "Как автоматизировать создание контент-плана",
          "Как автоматизировать повторяющиеся задачи",
          "Как построить простую AI-цепочку",
          "Как превратить рутинный процесс в автоматизацию",

          # 51-60 — КОНТЕНТ

          "Как создать контент-план на месяц с помощью ИИ",
          "Как находить идеи для Telegram-постов",
          "Как писать сильные заголовки с помощью ИИ",
          "Как создавать короткие посты быстрее",
          "Как использовать ИИ для сценариев видео",
          "Как превращать одну идею в 10 публикаций",
          "Как создавать серии постов с помощью ИИ",
          "Как использовать ИИ для контент-аналитики",
          "Как сделать Telegram-канал полуавтоматическим",
          "Как создать контент-фабрику с нуля",

          # 61-70 — НЕЙРОСЕТИ

          "Что такое большие языковые модели",
          "Чем чат-бот отличается от AI-агента",
          "Что такое AI-агент простыми словами",
          "Как ИИ понимает текст",
          "Как нейросети работают с изображениями",
          "Как ИИ работает с голосом",
          "Что такое генерация видео с помощью ИИ",
          "Почему ИИ иногда ошибается",
          "Как проверять ответы нейросети",
          "Какие задачи лучше не отдавать ИИ",

          # 71-80 — ПРАКТИКА

          "5 задач, которые можно решить с ИИ за 10 минут",
          "Как использовать ИИ со смартфона",
          "Как анализировать PDF с помощью ИИ",
          "Как работать с таблицами при помощи ИИ",
          "Как использовать ИИ для обучения",
          "Как изучить новую тему быстрее с ИИ",
          "Как подготовиться к собеседованию с помощью ИИ",
          "Как использовать ИИ для изучения языка",
          "Как использовать ИИ для путешествий",
          "Как использовать ИИ для личного планирования",

          # 81-90 — ОШИБКИ

          "7 ошибок новичков при использовании ИИ",
          "Почему ИИ иногда даёт бесполезные ответы",
          "Почему нельзя бездумно копировать ответы ИИ",
          "Как не зависеть от нейросети",
          "Какие данные нельзя отправлять ИИ",
          "Как проверять факты после ответа ИИ",
          "Почему длинный промпт не всегда лучше",
          "Почему ИИ не всегда понимает задачу",
          "Как избежать повторяющихся ответов ИИ",
          "Как контролировать качество AI-контента",

          # 91-100 — РАЗВИТИЕ

          "Какие AI-навыки будут полезны специалисту",
          "Как начать изучать искусственный интеллект с нуля",
          "Какие профессии меняются из-за ИИ",
          "Как подготовиться к AI-first работе",
          "Почему умение автоматизировать становится важнее",
          "Как создать собственную AI-систему",
          "Как построить личную AI-инфраструктуру",
          "Как перейти от использования ИИ к автоматизации",
          "Как превратить ИИ в личного цифрового помощника",
          "Что изучать после базовых навыков работы с ИИ"

          ]

          # ==========================================================
          # ФАЙЛ ИСТОРИИ
          # ==========================================================

          history_path = Path("data/published_topics.json")
          history_path.parent.mkdir(parents=True, exist_ok=True)

          if history_path.exists():

              try:
                  history = json.loads(
                      history_path.read_text(encoding="utf-8")
                  )

                  if not isinstance(history, list):
                      history = []

              except Exception:
                  history = []

          else:
              history = []

          # ==========================================================
          # ЗАЩИТА ОТ ПОВТОРОВ
          # ==========================================================

          available = [
              topic
              for topic in topics
              if topic not in history
          ]

          # Если все 100 тем использованы —
          # начинаем новый цикл.

          if not available:

              print("Все 100 тем уже опубликованы.")
              print("Начинаем новый цикл.")

              history = []
              available = topics.copy()

          # Берём случайную тему из ещё не опубликованных.

          topic = random.choice(available)

          # ==========================================================
          # ГЕНЕРАЦИЯ ПОСТА БЕЗ ПЛАТНОГО AI API
          # ==========================================================

          title_templates = [
              f"🤖 {topic}",
              f"💡 {topic}",
              f"🚀 {topic}",
              f"⚡ {topic}",
              f"🧠 {topic}"
          ]

          title = random.choice(title_templates)

          introductions = [

              "Искусственный интеллект становится полезным не тогда, когда мы просто задаём ему вопросы, а когда используем его для конкретных задач.",

              "Не обязательно быть программистом, чтобы использовать ИИ в повседневной работе.",

              "Одна из главных возможностей ИИ — убрать рутинные действия и оставить человеку больше времени на действительно важные задачи.",

              "Многие используют нейросети только как чат. Но на практике их возможности намного шире.",

              "Если правильно встроить ИИ в рабочий процесс, он может существенно сократить количество повторяющейся работы."
          ]

          tips = [

              "1️⃣ Сначала сформулируйте конкретную цель. Чем понятнее задача, тем полезнее результат.",

              "2️⃣ Дайте ИИ необходимый контекст: кто вы, что нужно получить и для кого предназначен результат.",

              "3️⃣ Укажите формат ответа. Например: список, таблица, инструкция, письмо или пошаговый план.",

              "4️⃣ Попросите ИИ проверить результат и найти возможные ошибки или слабые места.",

              "5️⃣ Не пытайтесь автоматизировать всё сразу. Начните с одной повторяющейся задачи.",

              "6️⃣ Сохраняйте удачные запросы. Со временем из них можно собрать собственную библиотеку промптов.",

              "7️⃣ Проверяйте важную информацию самостоятельно, особенно если она влияет на деньги или решения.",

              "8️⃣ Объединяйте несколько действий в одну цепочку. Именно здесь начинается настоящая автоматизация."
          ]

          conclusions = [

              "Главная идея: использовать ИИ нужно не ради самого ИИ, а ради конкретного результата.",

              "Начните с одной небольшой задачи, которую вы выполняете регулярно. Именно такие задачи проще всего автоматизировать.",

              "Чем чаще вы повторяете одну операцию, тем больше смысла имеет попробовать передать её часть ИИ.",

              "ИИ не обязан полностью заменять человека. Гораздо практичнее использовать его как цифрового помощника.",

              "Хорошая автоматизация экономит не только время, но и внимание."
          ]

          ctas = [

              "А какую задачу вы бы первым делом передали ИИ?",

              "Какая рутинная операция отнимает у вас больше всего времени?",

              "Используете ИИ в работе или пока только экспериментируете?",

              "Сохраните пост, если хотите попробовать это на практике.",

              "Напишите в комментариях, какую тему разобрать следующей."
          ]

          # Выбираем элементы детерминированно относительно темы,
          # чтобы одинаковая тема в новом цикле получила другую комбинацию.

          seed = sum(ord(c) for c in topic)
          local_random = random.Random(seed + len(history))

          intro = local_random.choice(introductions)

          selected_tips = local_random.sample(
              tips,
              4
          )

          conclusion = local_random.choice(conclusions)
          cta = local_random.choice(ctas)

          message = (
              f"{title}\n\n"
              f"{intro}\n\n"
              + "\n\n".join(selected_tips)
              + f"\n\n{conclusion}\n\n"
              f"{cta}"
          )

          # Telegram ограничивает sendMessage 4096 символами.

          message = message[:3900]

          # ==========================================================
          # ПУБЛИКАЦИЯ В TELEGRAM
          # ==========================================================

          token = os.environ["TELEGRAM_BOT_TOKEN"]

          telegram_data = json.dumps({
              "chat_id": "@AIFactoryA",
              "text": message
          }).encode("utf-8")

          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=telegram_data,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  result = json.loads(
                      response.read().decode("utf-8")
                  )

          except Exception as error:

              print("Telegram publication error:")
              print(error)

              raise

          if not result.get("ok"):

              print(
                  json.dumps(
                      result,
                      ensure_ascii=False,
                      indent=2
                  )
              )

              raise SystemExit(
                  "Telegram publication failed"
              )

          # ==========================================================
          # СОХРАНЯЕМ ИСТОРИЮ
          # ==========================================================

          history.append(topic)

          history_path.write_text(
              json.dumps(
                  history,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ==========================================================
          # ИНФОРМАЦИЯ В LOG
          # ==========================================================

          print("")
          print("======================================")
          print("POST PUBLISHED SUCCESSFULLY")
          print("======================================")
          print(f"Topic: {topic}")
          print(f"Used topics: {len(history)}/{len(topics)}")
          print(f"Remaining topics: {len(topics) - len(history)}")
          print("")
          print(message)
          print("======================================")

          PY

      # ==========================================================
      # СОХРАНЯЕМ ИСТОРИЮ В GITHUB
      # ==========================================================

      - name: Save publication history
        run: |

          git config user.name "AI Content Factory"
          git config user.email "actions@github.com"

          git add data/published_topics.json

          if git diff --cached --quiet; then
            echo "No history changes"
          else
            git commit -m "Update published topics history"
            git push
          fi
