name: AI Content Factory

on:
  workflow_dispatch:

  schedule:
    - cron: "17 7 * * *"
    - cron: "17 11 * * *"
    - cron: "17 15 * * *"
    - cron: "17 19 * * *"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Create and publish post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import random
          from datetime import datetime

          # ==========================
          # БАЗА ТЕМ
          # ==========================

          posts = [

          (
          "🤖 5 задач, которые уже можно отдать ИИ",
          """ИИ сегодня полезен не только для написания текстов.

          Вот 5 задач, которые можно передать ему уже сейчас:

          1️⃣ Составление писем — ИИ превращает несколько мыслей в готовое письмо.

          2️⃣ Анализ документов — можно быстро найти основные пункты, риски и важные цифры.

          3️⃣ Создание контента — посты, описания товаров, сценарии и идеи.

          4️⃣ Работа с таблицами — анализ данных, поиск ошибок и подготовка выводов.

          5️⃣ Исследование рынка — сбор информации и составление структурированного отчёта.

          Главное правило: ИИ лучше использовать не вместо человека, а как инструмент ускорения работы.

          А какую задачу вы бы первым делом отдали ИИ?"""
          ),

          (
          "💰 Как ИИ помогает экономить деньги",
          """ИИ может быть полезен не только для заработка, но и для сокращения расходов.

          Например:

          🔹 сравнить несколько предложений поставщиков;

          🔹 найти более дешёвые альтернативы товарам;

          🔹 проверить договор перед подписанием;

          🔹 составить список вопросов продавцу;

          🔹 проанализировать ежемесячные расходы;

          🔹 подготовить переговорную позицию.

          Особенно полезно использовать ИИ перед покупкой дорогого товара или услуги.

          Несколько минут анализа могут помочь заметить то, что легко пропустить.

          Использовали ИИ для экономии денег?"""
          ),

          (
          "⚡ ИИ + бизнес: 7 идей для автоматизации",
          """Даже небольшой бизнес может автоматизировать часть рутины.

          1️⃣ Ответы на типовые вопросы клиентов.

          2️⃣ Создание коммерческих предложений.

          3️⃣ Подготовка описаний товаров.

          4️⃣ Анализ отзывов клиентов.

          5️⃣ Составление контент-плана.

          6️⃣ Обработка заявок.

          7️⃣ Подготовка ежедневных отчётов.

          Самое интересное начинается тогда, когда несколько таких процессов объединяются в одну систему.

          Например: заявка клиента → обработка → подготовка ответа → уведомление менеджера.

          Какой процесс в вашем бизнесе занимает больше всего времени?"""
          ),

          (
          "🧠 Как правильно ставить задачу ИИ",
          """Большинство людей получают слабый результат от ИИ не потому, что модель плохая.

          Часто проблема в самой постановке задачи.

          Вместо:

          ❌ «Напиши пост про бизнес»

          попробуйте:

          ✅ «Напиши Telegram-пост на русском языке для владельцев малого бизнеса. Дай 5 конкретных способов снизить расходы. Каждый пункт — с примером. Объём — до 1500 знаков».

          Чем точнее задача, тем меньше исправлений потребуется.

          Хороший запрос обычно содержит:

          🎯 цель;

          👤 аудиторию;

          📌 контекст;

          📏 ограничения;

          📤 формат результата.

          Попробуйте изменить один свой запрос по этой схеме."""
          ),

          (
          "📱 5 способов использовать ИИ со смартфона",
          """Для работы с ИИ сегодня необязательно иметь компьютер.

          Со смартфона можно:

          1️⃣ расшифровать голосовую заметку;

          2️⃣ сфотографировать документ и попросить объяснить его содержание;

          3️⃣ написать письмо или сообщение;

          4️⃣ подготовить план поездки или покупки;

          5️⃣ быстро разобраться в незнакомой теме.

          Особенно удобно использовать голосовой ввод: просто объясняете задачу своими словами, а ИИ превращает её в структурированный результат.

          Попробуйте сегодня автоматизировать хотя бы одну рутинную задачу."""
          ),

          (
          "🚀 Что изучить про ИИ в первую очередь",
          """Если вы только начинаете разбираться в искусственном интеллекте, не нужно изучать всё сразу.

          Начните с пяти навыков:

          1️⃣ правильно формулировать запросы;

          2️⃣ проверять полученную информацию;

          3️⃣ работать с документами;

          4️⃣ автоматизировать повторяющиеся задачи;

          5️⃣ объединять несколько инструментов в один процесс.

          После этого ИИ перестаёт быть просто «чатом, которому задают вопросы».

          Он превращается в рабочий инструмент.

          Самый полезный навык — не знать сотни сервисов, а понимать, какую задачу нужно автоматизировать."""
          ),

          (
          "🔥 ИИ может стать вашим личным ассистентом",
          """Представьте, что утром вы отправляете одну голосовую команду.

          А дальше система:

          📩 анализирует сообщения;

          📋 составляет список задач;

          📅 формирует план дня;

          ✍️ готовит ответы;

          📊 анализирует необходимые данные;

          📢 создаёт контент.

          Технически такие цепочки уже можно собрать из нескольких сервисов.

          Самое важное — определить повторяющиеся действия.

          Если вы делаете одну и ту же операцию каждый день, стоит проверить, можно ли её автоматизировать.

          Какая ежедневная задача раздражает вас больше всего?"""
          ),

          (
          "💡 3 правила безопасной работы с ИИ",
          """ИИ экономит время, но ему нельзя бездумно доверять.

          Три базовых правила:

          1️⃣ Проверяйте важные факты.

          2️⃣ Не передавайте конфиденциальные данные без необходимости.

          3️⃣ Для финансовых, юридических и медицинских решений используйте ИИ как вспомогательный инструмент, а не как единственный источник.

          Хорошая автоматизация — это не когда человек исчезает из процесса.

          Это когда человек контролирует результат, а машина выполняет рутину.

          Сохраняйте этот пост, если используете ИИ в работе."""
          )

          ]

          # ==========================
          # ВЫБОР ПОСТА
          # ==========================

          now = datetime.utcnow()

          index = (now.timetuple().tm_yday * 4 + now.hour) % len(posts)

          title, body = posts[index]

          message = f"{title}\n\n{body}"

          # ==========================
          # TELEGRAM
          # ==========================

          token = os.environ["TELEGRAM_BOT_TOKEN"]

          data = json.dumps({
              "chat_id": "@AIFactoryA",
              "text": message
          }).encode("utf-8")

          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.loads(
                  response.read().decode("utf-8")
              )

          print(json.dumps(result, ensure_ascii=False, indent=2))

          if not result.get("ok"):
              raise SystemExit("Telegram publication failed")

          print("================================")
          print("POST PUBLISHED SUCCESSFULLY")
          print("================================")
          PY
