HISTORY_FILE = Path("data/published_topics.json")


def load_history():

    if HISTORY_FILE.exists():

        return json.loads(
            HISTORY_FILE.read_text(
                encoding="utf-8"
            )
        )

    return []


def save_history(history):

    HISTORY_FILE.parent.mkdir(
        exist_ok=True
    )

    HISTORY_FILE.write_text(
        json.dumps(
            history,
            ensure_ascii=False,
            indent=2
        ),
        encoding="utf-8"
    )


def create_post(topic):

    variants = [

        "ИИ становится важным инструментом для работы и бизнеса.",

        "Сегодня многие задачи можно выполнять быстрее благодаря автоматизации.",

        "Главное преимущество ИИ — экономия времени и повышение эффективности.",

    ]


    tips = [

        "1️⃣ Определите конкретную задачу.",

        "2️⃣ Дайте системе правильный контекст.",

        "3️⃣ Проверяйте полученный результат.",

        "4️⃣ Постепенно автоматизируйте повторяющиеся действия.",

    ]


    return f"""
🚀 {topic}


{random.choice(variants)}


Что можно сделать:

{tips[0]}

{tips[1]}

{tips[2]}

{tips[3]}


💡 Начните с одной простой задачи и постепенно расширяйте использование ИИ.


Подписывайтесь:
@AIFactoryA


#ИИ #бизнес #автоматизация
"""


def send_telegram(text):

    url = (
        f"https://api.telegram.org/"
        f"bot{TOKEN}/sendMessage"
    )


    data = json.dumps(
        {
            "chat_id": CHANNEL,
            "text": text
        },
        ensure_ascii=False
    ).encode("utf-8")


    request = urllib.request.Request(
        url,
        data=data,
        headers={
            "Content-Type":
            "application/json"
        }
    )


    with urllib.request.urlopen(request) as response:

        result = json.loads(
            response.read()
        )


    if not result["ok"]:

        raise Exception(result)



def main():

    history = load_history()


    available = [
        x for x in TOPICS
        if x not in history
    ]


    if not available:

        history = []

        available = TOPICS


    topic = random.choice(
        available
    )


    post = create_post(topic)


    send_telegram(post)


    history.append(topic)

    save_history(history)


    print(
        "Опубликовано:",
        topic
    )

    print(
        "Использовано тем:",
        len(history)
    )


if __name__ == "__main__":
    main()
