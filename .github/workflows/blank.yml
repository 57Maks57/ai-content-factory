          import json
          import random
          import subprocess
          import html
          import textwrap
          from pathlib import Path
          from datetime import datetime, timezone

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHANNEL = os.environ["TELEGRAM_CHANNEL"]

          HISTORY_FILE = Path("data/published_topics.json")
